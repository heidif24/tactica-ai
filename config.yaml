# Tactica AI - Configuration
# All monetary values are in USD. Risk limits are hard-enforced.

project:
  name: "Tactica AI"
  version: "0.1.0"
  mode: "paper"

risk:
  max_total_capital: 100.0
  max_position_pct: 0.20
  max_portfolio_exposure: 0.80
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.10
  min_cash_reserve_pct: 0.15
  max_open_positions: 5
  allow_shorting: false
  trading_halted: false

universe:
  default_symbols:
    - "SPY"
    - "QQQ"
    - "IWM"
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "AMZN"
    - "NVDA"
    - "META"
    - "TSLA"
  max_symbols: 20

strategy:
  name: "hybrid_conservative"
  lookback_days: 20
  momentum_threshold: 0.025
  holding_period_days: 5
  rebalance_frequency: "daily"
  z_entry: 1.8
  z_exit: 0.3
  require_volume_confirm: true

prediction:
  horizon_days: 5
  min_probability: 0.58
  use_ml: false

data:
  timeframe: "1Day"
  history_days: 365
  cache_dir: "data/cache"
  source: "alpaca"

execution:
  order_type: "market"
  time_in_force: "day"
  slippage_bps: 5
  commission_per_trade: 0.0
  min_notional: 1.0

backtest:
  initial_capital: 100.0
  start_date: "2023-01-01"
  end_date: null
  benchmark: "SPY"
  include_costs: true

dashboard:
  refresh_seconds: 60
  theme: "dark"
